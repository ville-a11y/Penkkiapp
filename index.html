<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>PenkkiApp – v18</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--green:#65bea2;--ink:#24302d;--chrome:#efc9ad;--line:#deddd8;--bench-w:7px;--bench-h:2px}
*{box-sizing:border-box;-webkit-text-size-adjust:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--chrome)}
body{display:flex;flex-direction:column;min-width:0;max-width:100vw}
.mobile-header{order:0;flex:0 0 76px;width:100%;min-width:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:radial-gradient(ellipse at 22% 10%,#f8dcc7 0%,transparent 62%),radial-gradient(ellipse at 85% 85%,#dba98b 0%,transparent 75%),#efc9ad;border-bottom:1px solid var(--line);z-index:50;overflow:hidden}
.mobile-logo{font-size:18px;line-height:1;font-weight:800;color:#2f725f;white-space:nowrap}.mobile-tag{font-size:11px;color:#59635f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mobile-menu{margin-left:auto;flex:0 0 36px;width:36px;height:36px;border:1px solid #d8d8d3;border-radius:50%;background:#fff;font-size:18px;color:#35403d}
#map{order:1;flex:1 1 auto;position:relative!important;inset:auto!important;width:100%!important;height:auto!important;min-width:0;min-height:0;overflow:hidden}
.mobile-footer{order:2;flex:0 0 68px;width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 104px 98px;gap:5px;align-items:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 75% 5%,#f8dcc7 0%,transparent 65%),radial-gradient(ellipse at 5% 100%,#dfb397 0%,transparent 75%),#f0ceb7;border-top:1px solid var(--line);z-index:50;overflow:hidden}
.footbtn{height:40px;min-width:0;max-width:100%;border:1px solid #d7d9d5;border-radius:13px;background:#fff;padding:0 5px;font-size:12px;line-height:1;font-weight:650;color:#34413d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footadd{justify-self:stretch;color:#2f725f;font-weight:750}.footspace{display:none}.mobile-footer #mobileLocate,.mobile-footer #mobileFilter{width:100%;max-width:100%}
.top,.places,.add{display:none!important}.status{display:none!important}
.bench-marker{width:16px;height:16px;display:flex;align-items:center;justify-content:center}.bench-shape{width:var(--bench-w);height:var(--bench-h);min-width:3px;min-height:3px;border-radius:2px;border:0.7px solid #367e69;box-shadow:0 0 0 .65px #f8fbf9;transform-origin:center;background:var(--green)}.bench-marker.line .bench-shape{border-radius:2px}.cluster-marker{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.90);border:2px solid rgba(88,189,138,.48);color:#315b4f;font:700 12px/1 system-ui,-apple-system,sans-serif;box-shadow:0 2px 7px #0002}.edit-seat{margin-top:8px;border:1px solid #bfd6c9;background:#eef8f2;border-radius:8px;padding:9px;font-weight:700}.bench-shape.other{background:#e5a96f;border-color:#9d7048}.bench-shape.user{outline:none}
.maplibregl-ctrl-bottom-left{left:8px!important;bottom:8px!important}.maplibregl-ctrl-attrib{display:none}.maplibregl-ctrl-group{border-radius:10px!important;overflow:hidden}.maplibregl-popup-content{border-radius:12px;padding:12px}.popup h3{margin:0 0 5px;font-size:16px}.popup p{margin:2px 0;font-size:13px}
.placebar{display:none;position:fixed;z-index:35;left:0;right:0;bottom:0;padding:24px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(247,244,238,.97) 24%)}.placing .placebar{display:block}.placing{display:block}.placing #map{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}.placing .mobile-header,.placing .mobile-footer,.placing .maplibregl-ctrl{display:none!important}.placecard{max-width:560px;margin:auto;background:#fff;border:1px solid #d7ddd9;border-radius:18px;box-shadow:0 8px 30px #0002;padding:10px}.placehint{text-align:center;font-size:12px;color:#59645f;margin-bottom:8px}.placecontrols{display:flex;gap:7px;align-items:center}.placecontrols button{min-height:42px;border-radius:12px;border:1px solid #cfd8d4;background:#fff;font-size:14px;font-weight:700}.rotate{width:50px;font-size:21px!important}.cancel{flex:1}.next{flex:1.3;background:var(--green)!important;border-color:var(--green)!important;color:#173d31}.draft-wrap{width:38px;height:38px;display:flex;align-items:center;justify-content:center}.draft-shape{width:24px;height:8px;border-radius:3px;background:var(--green);border:1px solid #367e69;box-shadow:0 0 0 1px #fff;transform-origin:center}
.modal{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,560px);max-height:82dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0002}.sheet h2{margin:0 0 12px;color:#2c7661;font-size:20px}.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.typegrid button{padding:13px 8px;border:1px solid #cfd8d4;border-radius:12px;background:#fff;font-weight:700}.typegrid button.selected{background:#e8f5ee;border-color:#67b994;color:#225e4c}.sheet label{display:block;font-size:13px;font-weight:650;color:#47524e;margin:10px 0 5px}.sheet input,.sheet select{width:100%;font:inherit;padding:11px;border:1px solid #cfd8d4;border-radius:10px;background:#fff}.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:12px;border-radius:10px;border:1px solid #cfd8d4;background:#fff;font-weight:700}.row .save{background:var(--green);color:#173d31;border-color:var(--green)}
@media(max-width:365px){.mobile-footer{flex-basis:101px;grid-template-columns:1fr 1fr;grid-template-rows:40px 40px;gap:4px;padding:5px 8px calc(5px + env(safe-area-inset-bottom))}.footadd{grid-column:1/-1}.mobile-footer #mobileLocate,.mobile-footer #mobileFilter{width:100%}}
@media(min-width:366px){.mobile-footer #mobileLocate,.mobile-footer #mobileFilter{font-size:11.5px}}
</style></head><body><div id="map"></div><header class="mobile-header"><div class="mobile-logo">PenkkiApp</div><div class="mobile-tag">Löydä paikka levähtää.</div><button class="mobile-menu" id="mapStyle" aria-label="Vaihda karttatyyppi" title="Kartta / satelliitti">◈</button></header><footer class="mobile-footer"><button class="footbtn footadd" id="mobileAdd">＋ Lisää istumapaikka</button><div class="footspace"></div><button class="footbtn" id="mobileLocate">◎ Paikanna</button><button class="footbtn" id="mobileFilter">☷ Suodata</button></footer><div class="top"><div class="brand">PenkkiApp</div><button class="btn locate" id="locate">◎ Paikanna</button></div><div class="places"><button class="btn" data-place="helsinki">Helsinki</button><button class="btn" data-place="corralejo">Corralejo</button><button class="btn" data-place="naxos">Naxos</button><button class="btn" data-place="lanta">Koh Lanta</button></div><button class="btn add" id="add">＋ Lisää istumapaikka</button><div class="btn status" id="status">Ladataan karttaa…</div>
<div class="placebar"><div class="placecard"><div class="placehint">Raahaa istumapaikka tarkalleen paikalleen. Käännä tarvittaessa.</div><div class="placecontrols"><button class="rotate" id="rotL">↶</button><button class="cancel" id="placeCancel">Peruuta</button><button class="next" id="placeNext">Seuraava</button><button class="rotate" id="rotR">↷</button></div></div></div>
<div class="modal" id="modal"><div class="sheet"><h2>Istumapaikan tiedot</h2><label>Tyyppi</label><div class="typegrid"><button id="typeBench" class="selected">Penkki</button><button id="typeOther">Muu istumapaikka</button></div><label>Sijaintikuvaus</label><input id="desc" placeholder="esim. S-Marketin eteisaula"><label>Selkänoja</label><select id="backrest"><option value="en tiedä">En tiedä</option><option value="kyllä">Kyllä</option><option value="ei">Ei</option></select><div class="row"><button id="formBack">Takaisin kartalle</button><button id="deleteSeat" style="display:none;color:#a33">Poista</button><button class="save" id="save">Tallenna</button></div></div></div>
<script>
const statusEl=document.getElementById('status');
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[24.9384,60.1699],zoom:11.75});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');
const markers=[];let requestSeq=0,timer,draftMarker=null,draftAngle=0,draftKind='official',editingId=null,osmCache=new Map(),satellite=false,filterMode='all';
const STORAGE='penkkiapp-user-seats-v16',OLD='penkkiapp-user-seats-v15';
function getUserSeats(){try{let a=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!a){a=JSON.parse(localStorage.getItem(OLD)||'[]');localStorage.setItem(STORAGE,JSON.stringify(a))}return a}catch(_){return []}}
function setUserSeats(x){localStorage.setItem(STORAGE,JSON.stringify(x))}
const places={helsinki:[24.9384,60.1699,11.75],corralejo:[-13.8669,28.7301,15],naxos:[25.3764,37.1056,15],lanta:[99.0416,7.6244,13]};
function clearBenches(){markers.splice(0).forEach(m=>m.remove())}function updateBenchScale(){const z=map.getZoom();let w=z<12?7:z<13?8:z<14?10:z<15?13:z<17?17:Math.min(38,17+(z-17)*7);let h=z<12?5:Math.max(3,Math.round(w/3));document.documentElement.style.setProperty('--bench-w',w+'px');document.documentElement.style.setProperty('--bench-h',h+'px')}function prop(t,k){return t&&t[k]!==undefined?t[k]:'–'}
function roadAngleAt(lon,lat){const p=map.project([lon,lat]),pad=48;let fs=[];try{fs=map.queryRenderedFeatures([[p.x-pad,p.y-pad],[p.x+pad,p.y+pad]])||[]}catch(_){return 0}let best=null;const walk=(coords)=>{for(let i=0;i<coords.length-1;i++){const a=map.project(coords[i]),b=map.project(coords[i+1]),vx=b.x-a.x,vy=b.y-a.y,len2=vx*vx+vy*vy;if(len2<4)continue;let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2;t=Math.max(0,Math.min(1,t));const qx=a.x+t*vx,qy=a.y+t*vy,d2=(p.x-qx)**2+(p.y-qy)**2;if(!best||d2<best.d2)best={d2,angle:Math.atan2(vy,vx)*180/Math.PI}}};for(const f of fs){const l=((f.layer?.id||'')+' '+(f.layer?.['source-layer']||'')).toLowerCase();if(!/road|street|highway|path|footway|pedestrian|cycle|transportation/.test(l))continue;const g=f.geometry;if(!g)continue;if(g.type==='LineString')walk(g.coordinates);else if(g.type==='MultiLineString')g.coordinates.forEach(walk)}return best&&best.d2<=48*48?best.angle:0}
function makeBenchEl(kind,angle,user=false){const outer=document.createElement('div');outer.className='bench-marker'+(map.getZoom()>=12.1?' line':'');const inner=document.createElement('div');inner.className='bench-shape '+(kind==='other'?'other':'')+(user?' user':'');inner.style.transform=`rotate(${angle}deg)`;outer.appendChild(inner);return outer}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addBench(lon,lat,tags={},kind='official',user=false,angle=null){let a=Number.isFinite(angle)?angle:(map.getZoom()>=14.2?roadAngleAt(lon,lat):0);const el=makeBenchEl(kind,a,user);const html=`<div class="popup"><h3>${kind==='official'?'Penkki':'Muu istumapaikka'}</h3><p>Selkänoja: ${escapeHTML(prop(tags,'backrest'))}</p>${tags.description?`<p>Sijainti: ${escapeHTML(tags.description)}</p>`:''}<p>Suunta: ${user?'käyttäjän asettama':'tien/polun mukaan'}</p><p>Lähde: ${escapeHTML(prop(tags,'source'))}</p>${user?`<button class="edit-seat" data-id="${tags.id}">Muokkaa / poista</button>`:''}</div>`;const m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).setPopup(new maplibregl.Popup({offset:12}).setHTML(html)).addTo(map);markers.push(m);if(user)m.getPopup().on('open',()=>{const btn=m.getPopup().getElement()?.querySelector('.edit-seat');if(btn)btn.onclick=()=>editSeat(Number(btn.dataset.id))})}
const HELSINKI_WFS='https://kartta.hel.fi/ws/geoserver/avoindata/wfs';async function fetchHelsinkiLayer(layer,b){const p=new URLSearchParams({service:'WFS',version:'1.0.0',request:'GetFeature',typeName:'avoindata:'+layer,srsName:'EPSG:4326',outputFormat:'application/json',bbox:`${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()},EPSG:4326`});const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(HELSINKI_WFS+'?'+p,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timeout)}}
function isBench(p={}){return Object.values(p).filter(v=>typeof v==='string').join(' ').toLowerCase().match(/penkki|bench/)}function coordsOf(g){if(!g)return null;if(g.type==='Point')return g.coordinates;if(g.type==='MultiPoint')return g.coordinates?.[0];return null}
function softenMap(){for(const l of map.getStyle()?.layers||[]){const key=((l.id||'')+' '+(l['source-layer']||'')).toLowerCase();try{if(l.type==='background')map.setPaintProperty(l.id,'background-color','#e9e9e5');if(l.type==='fill'){if(/water|ocean|lake|river/.test(key)){map.setPaintProperty(l.id,'fill-color','#dbeaf0');map.setPaintProperty(l.id,'fill-opacity',.9)}else if(/park|grass|wood|forest|green|garden|cemetery/.test(key)){map.setPaintProperty(l.id,'fill-color','#e9f2e6');map.setPaintProperty(l.id,'fill-opacity',.72)}else if(/building/.test(key)){map.setPaintProperty(l.id,'fill-color','#dededb');map.setPaintProperty(l.id,'fill-opacity',1);try{map.setPaintProperty(l.id,'fill-outline-color','#c1c4c1')}catch(_){}}else{try{map.setPaintProperty(l.id,'fill-color','#e7e7e3')}catch(_){};try{map.setPaintProperty(l.id,'fill-opacity',1)}catch(_){}}}if(l.type==='line'){if(/road|street|highway|motorway|trunk|primary|secondary|tertiary|path|footway|pedestrian/.test(key)){map.setPaintProperty(l.id,'line-color','#fcfcf9');map.setPaintProperty(l.id,'line-opacity',.98)}else try{map.setPaintProperty(l.id,'line-opacity',.85)}catch(_){}}if(l.type==='symbol'){try{map.setPaintProperty(l.id,'text-color','#5d6562')}catch(_){};try{map.setPaintProperty(l.id,'text-halo-color','#f7f7f4')}catch(_){};try{map.setPaintProperty(l.id,'text-halo-width',.85)}catch(_){};try{map.setPaintProperty(l.id,'icon-opacity',1)}catch(_){}}}catch(e){}}}
function addCluster(lon,lat,count){const el=document.createElement('div');el.className='cluster-marker';el.textContent=count;const m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map);el.onclick=(e)=>{e.stopPropagation();map.easeTo({center:[lon,lat],zoom:Math.min(map.getZoom()+1.8,14.2)})};markers.push(m)}
function clusterFeatures(items){const z=map.getZoom();if(z>=11.15)return null;const cell=z<10.3?85:65,groups=new Map();for(const it of items){const p=map.project([it.lon,it.lat]),kx=Math.floor(p.x/cell),ky=Math.floor(p.y/cell),k=kx+','+ky;let g=groups.get(k);if(!g){g={n:0,lon:0,lat:0};groups.set(k,g)}g.n++;g.lon+=it.lon;g.lat+=it.lat}return [...groups.values()].map(g=>({n:g.n,lon:g.lon/g.n,lat:g.lat/g.n}))}
function renderUserSeats(){const b=map.getBounds();for(const x of getUserSeats())if((filterMode==='all'||filterMode===x.kind)&&b.contains([x.lon,x.lat]))addBench(x.lon,x.lat,{backrest:x.backrest,source:'PenkkiApp / oma lisäys',description:x.description,id:x.id},x.kind,true,Number.isFinite(x.angle)?x.angle:0)}
async function loadBenches(){if(document.body.classList.contains('placing'))return;if(map.getZoom()<10.3){clearBenches();statusEl.textContent='Lähennä karttaa hieman nähdäksesi penkit.';return}const seq=++requestSeq,b=map.getBounds(),c=map.getCenter();if(!(c.lat>60.10&&c.lat<60.32&&c.lng>24.75&&c.lng<25.30)){await loadOSMBenches(seq,b);return}statusEl.textContent='Haetaan Helsingin penkkejä…';try{const results=await Promise.all(['YLRE_Katuosat_piste','YLRE_Viherosat_piste'].map(x=>fetchHelsinkiLayer(x,b)));if(seq!==requestSeq)return;clearBenches();let n=0,items=[];for(const fc of results)for(const f of fc.features||[]){if(!isBench(f.properties||{}))continue;const xy=coordsOf(f.geometry);if(!xy)continue;items.push({lon:xy[0],lat:xy[1]});n++}const clusters=clusterFeatures(items);if(clusters){for(const g of clusters)addCluster(g.lon,g.lat,g.n)}else{if(filterMode!=='other')for(const x of items)addBench(x.lon,x.lat,{backrest:'–',source:'Helsingin kaupunki'})}renderUserSeats();statusEl.innerHTML=n?`Näkyvällä alueella <b>${n}</b> kaupungin penkkiä + omat lisäykset.`:'Ei kaupungin rekisteripenkkejä tällä ruudulla.'}catch(e){if(seq!==requestSeq)return;clearBenches();renderUserSeats();statusEl.textContent='Helsingin penkkidatan haku epäonnistui. Omat lisäykset näkyvät silti.'}}
async function loadOSMBenches(seq,b){clearBenches();renderUserSeats();const area=(b.getNorth()-b.getSouth())*(b.getEast()-b.getWest());if(area>.035){statusEl.textContent='Lähennä karttaa nähdäksesi alueen penkit.';return}const key=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(2)).join(',');let items=osmCache.get(key);if(!items){const q=`[out:json][timeout:18];(node["amenity"="bench"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}););out body 1500;`;try{const controller=new AbortController(),to=setTimeout(()=>controller.abort(),22000);let r;try{r=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:q}),signal:controller.signal});if(!r.ok)throw Error(r.status);const j=await r.json();items=(j.elements||[]).filter(x=>Number.isFinite(x.lon)&&Number.isFinite(x.lat)).map(x=>({lon:x.lon,lat:x.lat}));osmCache.set(key,items)}finally{clearTimeout(to)}}catch(e){if(seq===requestSeq)statusEl.textContent='Kansainvälistä penkkiaineistoa ei saatu juuri nyt. Omat penkit näkyvät.';return}}if(seq!==requestSeq)return;clearBenches();const groups=clusterFeatures(items);if(groups)groups.forEach(x=>addCluster(x.lon,x.lat,x.n));else if(filterMode!=='other')items.forEach(x=>addBench(x.lon,x.lat,{source:'OpenStreetMap'}));renderUserSeats();statusEl.textContent=`OpenStreetMap: ${items.length} penkkiä tällä alueella`}
function startPlacement(){editingId=null;document.body.classList.add('placing');map.getCanvas().style.cursor='';draftAngle=roadAngleAt(map.getCenter().lng,map.getCenter().lat);draftKind='official';const el=document.createElement('div');el.className='draft-wrap';el.innerHTML='<div class="draft-shape"></div>';draftMarker=new maplibregl.Marker({element:el,draggable:true,anchor:'center'}).setLngLat(map.getCenter()).addTo(map);updateDraft();}
function updateDraft(){if(!draftMarker)return;const sh=draftMarker.getElement().querySelector('.draft-shape');sh.style.transform=`rotate(${draftAngle}deg)`;sh.style.background=draftKind==='other'?'#e5a96f':'#65bea2'}
function stopPlacement(remove=true){document.body.classList.remove('placing');if(remove&&draftMarker){draftMarker.remove();draftMarker=null}loadBenches()}
document.getElementById('deleteSeat').onclick=()=>{if(editingId===null)return;if(!confirm('Poistetaanko tämä istumapaikka?'))return;setUserSeats(getUserSeats().filter(x=>x.id!==editingId));editingId=null;document.getElementById('modal').classList.remove('open');stopPlacement(true)};document.getElementById('add').onclick=startPlacement;document.getElementById('mobileAdd').onclick=startPlacement;document.getElementById('placeCancel').onclick=()=>stopPlacement(true);document.getElementById('rotL').onclick=()=>{draftAngle=(draftAngle-5+360)%360;updateDraft()};document.getElementById('rotR').onclick=()=>{draftAngle=(draftAngle+5)%360;updateDraft()};document.getElementById('placeNext').onclick=()=>{document.getElementById('deleteSeat').style.display=editingId===null?'none':'block';document.getElementById('modal').classList.add('open')};
function selectType(k){draftKind=k;document.getElementById('typeBench').classList.toggle('selected',k==='official');document.getElementById('typeOther').classList.toggle('selected',k==='other');updateDraft()}document.getElementById('typeBench').onclick=()=>selectType('official');document.getElementById('typeOther').onclick=()=>selectType('other');document.getElementById('formBack').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('save').onclick=()=>{if(!draftMarker)return;const c=draftMarker.getLngLat(),x={id:Date.now(),lon:c.lng,lat:c.lat,kind:draftKind,angle:draftAngle,description:document.getElementById('desc').value.trim(),backrest:document.getElementById('backrest').value};const a=getUserSeats();if(editingId!==null){x.id=editingId;const i=a.findIndex(y=>y.id===editingId);if(i>=0)a[i]=x;else a.push(x)}else a.push(x);setUserSeats(a);editingId=null;document.getElementById('modal').classList.remove('open');document.getElementById('desc').value='';draftMarker.remove();draftMarker=null;stopPlacement(false);statusEl.textContent='Istumapaikka tallennettu tähän laitteeseen.'};
function editSeat(id){const x=getUserSeats().find(y=>y.id===id);if(!x)return;startPlacement();editingId=id;draftMarker.setLngLat([x.lon,x.lat]);draftAngle=x.angle||0;selectType(x.kind);document.getElementById('desc').value=x.description||'';document.getElementById('backrest').value=x.backrest||'en tiedä';updateDraft();map.easeTo({center:[x.lon,x.lat],zoom:Math.max(map.getZoom(),16)})}
const doLocate=()=>navigator.geolocation?.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:16}),()=>statusEl.textContent='Sijaintilupaa ei saatu. Voit liikuttaa karttaa käsin.',{enableHighAccuracy:true,timeout:10000});document.getElementById('locate').onclick=doLocate;document.getElementById('mobileLocate').onclick=doLocate;document.getElementById('mobileFilter').onclick=()=>{const a=['all','official','other'];filterMode=a[(a.indexOf(filterMode)+1)%a.length];document.getElementById('mobileFilter').textContent=filterMode==='all'?'☷ Kaikki':filterMode==='official'?'☷ Penkit':'☷ Muut';loadBenches()};document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const p=places[b.dataset.place];map.flyTo({center:[p[0],p[1]],zoom:p[2]})});map.on('load',()=>{softenMap();updateBenchScale();loadBenches()});document.getElementById('mapStyle').onclick=()=>{satellite=!satellite;map.setStyle(satellite?{version:8,sources:{imagery:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri'}} ,layers:[{id:'imagery',type:'raster',source:'imagery'}]}:'https://tiles.openfreemap.org/styles/liberty');document.getElementById('mapStyle').textContent=satellite?'▤':'◈';map.once('style.load',()=>{if(!satellite)softenMap();loadBenches()})};map.on('zoom',updateBenchScale);map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(loadBenches,650)});
</script></body></html>
